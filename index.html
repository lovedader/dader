<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>情感語錄 - 投稿</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Noto Sans TC', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: linear-gradient(135deg, #fff0eb, #ffdcd1, #ffc4b3); background-attachment: fixed; color: #202124; display: flex; flex-direction: column; align-items: center; min-height: 100vh; width: 100%; padding: 20px 15px; padding-bottom: calc(20px + env(safe-area-inset-bottom)); overflow-x: hidden; }
        .page-section { display: none; width: 100%; max-width: 640px; }
        .page-section.active { display: flex; flex-direction: column; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        #homePage { justify-content: center; align-items: center; min-height: 75vh; gap: 40px; }
        .home-logo { width: 100%; max-width: 350px; height: auto; object-fit: contain; border-radius: 12px; }
        .start-btn { background: linear-gradient(45deg, #ff8c69, #f08080); color: white; border: none; padding: 16px 48px; font-size: 1.2rem; font-weight: 600; border-radius: 30px; cursor: pointer; transition: transform 0.2s; letter-spacing: 2px; box-shadow: 0 6px 20px rgba(240, 128, 128, 0.4); }
        .start-btn:active { transform: scale(0.95); }
        .logo-display { width: 100%; display: flex; justify-content: center; margin-bottom: 15px; }
        .logo-display img { width: 100%; max-width: 350px; height: auto; border-radius: 12px; }
        .card { background: #ffffff; border-radius: 12px; box-shadow: 0 4px 15px rgba(240, 128, 128, 0.15); width: 100%; overflow: hidden; }
        .card-content { padding: 24px 30px; }
        .card-title { font-size: 1.5rem; text-align: center; margin-bottom: 10px; }
        .question-label { display: block; font-size: 1rem; font-weight: 500; margin-bottom: 20px; }
        .line-textarea { width: 100%; border: none; border-bottom: 2px solid #ffc4b3; background: transparent; font-size: 1rem; padding: 8px 0; min-height: 120px; resize: none; }
        .line-textarea:focus { outline: none; border-bottom: 2px solid #f08080; }
        .submit-btn { background: linear-gradient(45deg, #ff8c69, #f08080); color: white; border: none; padding: 16px; font-size: 1.1rem; font-weight: 600; border-radius: 25px; cursor: pointer; width: 100%; margin-top: 10px; transition: transform 0.2s; }
        .submit-btn:active { transform: scale(0.98); }
        .submit-btn:disabled { opacity: 0.7; cursor: not-allowed; }
        .toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.8); color: #fff; padding: 12px 24px; border-radius: 25px; opacity: 0; visibility: hidden; transition: 0.3s; z-index: 999; }
        .toast.show { opacity: 1; visibility: visible; }
    </style>
</head>
<body>

    <div id="homePage" class="page-section active">
        <img src="logo.png" alt="Logo" class="home-logo">
        <button class="start-btn" id="goToFormBtn">我要投稿</button>
    </div>

    <div id="formPage" class="page-section">
        <div class="logo-display"><img src="logo.png" alt="Logo"></div>
        <div class="card">
            <div class="card-content">
                <h1 class="card-title">投稿語錄</h1>
                <label class="question-label">請輸入要投稿的語錄</label>
                <textarea id="quoteInput" class="line-textarea" placeholder="請輸入文字" maxlength="300"></textarea>
            </div>
        </div>
        <button class="submit-btn" id="submitBtn">送出投稿</button>
    </div>

    <div id="toast" class="toast">投稿成功！感謝分享</div>

<script>
    // 🌟 你的 crudcrud 專屬網址
    const API_URL = 'https://crudcrud.com/api/7fc65a7e934c4e50985a9c94c7d1e2b9/quotes';

    const homePage = document.getElementById('homePage');
    const formPage = document.getElementById('formPage');
    const goToFormBtn = document.getElementById('goToFormBtn');
    const quoteInput = document.getElementById('quoteInput');
    const submitBtn = document.getElementById('submitBtn');
    const toastEl = document.getElementById('toast');

    function showToast(msg) {
        toastEl.textContent = msg;
        toastEl.classList.add('show');
        setTimeout(() => toastEl.classList.remove('show'), 2500);
    }

    goToFormBtn.addEventListener('click', () => {
        homePage.classList.remove('active');
        formPage.classList.add('active');
        setTimeout(() => quoteInput.focus(), 300);
    });

    submitBtn.addEventListener('click', async function() {
        const text = quoteInput.value.trim();
        if (!text) { alert("請填寫投稿語錄！"); return; }

        submitBtn.disabled = true;
        submitBtn.textContent = '傳送中...';

        try {
            // 🚀 直接 POST 寫入單筆資料
            const postRes = await fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    text: text, 
                    timestamp: Date.now() 
                })
            });

            if (!postRes.ok) throw new Error('寫入失敗');

            quoteInput.value = '';
            showToast('投稿成功！');
        } catch (error) {
            console.error('詳細錯誤:', error);
            showToast('網路錯誤，請稍後再試');
        } finally {
            submitBtn.disabled = false;
            submitBtn.textContent = '送出投稿';
        }
    });
</script>
</body>
</html>
